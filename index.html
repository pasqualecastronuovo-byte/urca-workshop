  <script>
    function playSound(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination);
        if(type === 'alarm') {
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(140, ctx.currentTime); osc.frequency.linearRampToValueAtTime(320, ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.2, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5); osc.start(); osc.stop(ctx.currentTime + 0.5);
        } else if(type === 'sos') {
          osc.type = 'sine'; osc.frequency.setValueAtTime(880, ctx.currentTime); osc.frequency.setValueAtTime(1100, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.5); osc.start(); osc.stop(ctx.currentTime + 0.5);
        } else if(type === 'win') {
          osc.type = 'square'; osc.frequency.setValueAtTime(440, ctx.currentTime); osc.frequency.setValueAtTime(660, ctx.currentTime + 0.1); osc.frequency.setValueAtTime(880, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4); osc.start(); osc.stop(ctx.currentTime + 0.4);
        }
      } catch(e) {}
    }
  </script>

  <script>
    let st = {
      ph: 0, tr: fasi[0].t, run: false, allowCrash: false, logs: [],
      tables: [
        { id: "t1", name: "Tavolo 1", sc: "burocrazia", hist: [], act: null, flip: false },
        { id: "t2", name: "Tavolo 2", sc: "van", hist: [], act: null, flip: false },
        { id: "t3", name: "Tavolo 3", sc: "salute", hist: [], act: null, flip: false }
      ]
    };
    let locUI = { hidden: false, zoom: false, zoomType: 'ctx', hasRevealed: false };
    let sbClient = null, sbChannel = null, timerInt = null, myView = 'admin';

    function emitEvent(type, payload) {
      const evt = { type, payload, ts: Date.now() }; applyEvent(evt);
      if (sbChannel) sbChannel.send({ type: 'broadcast', event: 'urca_evt', payload: evt });
      else localStorage.setItem('urca_bus', JSON.stringify(evt));
    }

    function applyEvent(e) {
      const p = e.payload;
      switch(e.type) {
        case 'TICK': st.tr = p.t; if(myView==='admin') updateAdminTime(); else updateTeamTime(); break;
        case 'T_CTRL': st.run = p.run; st.tr = p.t; st.ph = p.ph; if(p.log) pushLog(p.log); renderAll(); break;
        case 'CFG': st.allowCrash = p.ac; if(p.log) pushLog(p.log); renderAll(); break;
        case 'ADD_T': st.tables.push({ id: p.id, name: p.n, sc: p.sc, hist: [], act: null, flip: false }); pushLog(`Creato ${p.n}`); renderAll(); break;
        case 'DEL_T': st.tables = st.tables.filter(x => x.id !== p.id); pushLog(`Rimosso ${p.id}`); renderAll(); break;
        case 'SHOCK': 
          let ts = st.tables.find(x => x.id === p.tid); if(!ts) break;
          ts.act = p.imp; ts.flip = p.flip;
          if(!ts.hist.some(h => h.id === p.imp)) { ts.hist.push({id: p.imp, st: 'new'}); p.isNew = true; }
          if(p.log) pushLog(p.log); renderAll(p.isNew); break;
        case 'VIEW':
          let tv = st.tables.find(x => x.id === p.tid); if(tv) { tv.act = p.imp; tv.flip = false; } renderAll(); break;
        case 'FLIP': 
          let tf = st.tables.find(x => x.id === p.tid); if(tf) tf.flip = p.flip; if(p.log) pushLog(p.log); renderAll(); break;
        case 'UNLOCK':
          let tu = st.tables.find(x => x.id === p.tid);
          if(tu) { let h = tu.hist.find(x=>x.id===tu.act); if(h) h.st = 'unlocked'; }
          if(p.log) pushLog(p.log); renderAll(); break;
        case 'SURVIVE':
          let tsv = st.tables.find(x => x.id === p.tid);
          if(tsv) { let h = tsv.hist.find(x=>x.id===tsv.act); if(h) h.st = 'survived'; }
          if(p.log) pushLog(p.log); renderAll(); break;
        case 'SOS':
          if(myView==='admin') {
            const tn = st.tables.find(x=>x.id===p.tid)?.name || 'Tavolo'; playSound('sos');
            const toast = document.createElement('div'); toast.className = 'bg-yellow-400 border-4 border-[#1A1A1A] p-3 rounded-xl shadow-lg flex items-center gap-3 animate-bounce';
            toast.innerHTML = `<span class="text-2xl">🆘</span><div><p class="font-display font-bold leading-tight">${tn} chiama!</p><p class="text-[10px] font-mono">Richiesta di supporto al tavolo.</p></div><button class="bg-green-500 text-white px-3 py-1.5 rounded-lg text-xs ml-2 hover:bg-green-600 font-bold retro-border" onclick="adminReplySOS('${p.tid}', this.parentElement)">ARRIVO 🏃‍♂️</button>`;
            document.getElementById('admin-toasts').appendChild(toast);
          }
          break;
        case 'SOS_REPLY':
          if(myView === p.tid) {
            playSound('win');
            const toast = document.createElement('div'); toast.className = 'bg-green-400 border-4 border-[#1A1A1A] px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 transition-all';
            toast.innerHTML = '<span class="text-2xl">🏃‍♂️</span><p class="font-display font-bold">Il facilitatore sta arrivando!</p>';
            document.getElementById('tm-toasts').appendChild(toast); setTimeout(() => toast.remove(), 6000);
          }
          break;
        case 'LOG': pushLog(p.msg); renderLog(); break;
        case 'CLR': st.logs = []; renderLog(); break;
        case 'REQ_SYNC': if(myView==='admin') emitEvent('FULL_SYNC', { state: st }); break;
        case 'FULL_SYNC': st = p.state; renderAll(); break;
      }
      localStorage.setItem('urca_state_v8', JSON.stringify(st));
    }

    function pushLog(m) { const t = new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); st.logs.push(`[${t}] ${m}`); if(st.logs.length > 50) st.logs.shift(); }

 	function init() {
	const bkp = localStorage.getItem('urca_state_v6');
      if (bkp) { let saved = JSON.parse(bkp); if(saved.tables) st = saved; }
      
      // =================================================================
      // 🟢 INCOLLA QUI LE TUE CHIAVI SUPABASE TRA LE VIRGOLETTE
      // =================================================================
      const MY_SUPABASE_URL = "https://qtmaptpsdizhjkqwqejl.supabase.co"; 
      const MY_SUPABASE_KEY = "sb_publishable_gs-LQ-kwAFNEbjwaX6sWHg_b8mA1juw";
      // =================================================================
      const params = new URLSearchParams(window.location.search);
      const url = params.get('sUrl') || (JSON.parse(localStorage.getItem('urca_cfg_v6') || '{}').url) || MY_SUPABASE_URL;
      const key = params.get('sKey') || (JSON.parse(localStorage.getItem('urca_cfg_v6') || '{}').key) || MY_SUPABASE_KEY;
      
      if (url && key && url !== "INCOLLA_QUI_IL_TUO_URL_PROJECT") { 
        document.getElementById('sb-url').value = url; 
        document.getElementById('sb-key').value = key; 
        connectCloud(url, key); 
      }

      route();
    }

    function route() {
      const hash = window.location.hash || '#admin';
      document.getElementById('view-admin').classList.add('hidden'); document.getElementById('view-admin').classList.remove('flex');
      document.getElementById('view-team').classList.add('hidden'); document.getElementById('view-team').classList.remove('flex');
      
      if (hash === '#admin') { 
        myView = 'admin'; 
        document.getElementById('view-admin').classList.remove('hidden'); 
        document.getElementById('view-admin').classList.add('flex'); 
        renderAdmin(); 
      } else { 
        myView = hash.replace('#', ''); 
        document.getElementById('view-team').classList.remove('hidden'); 
        document.getElementById('view-team').classList.add('flex'); 
        if (!sbChannel) emitEvent('REQ_SYNC', {}); 
        renderTeam(); 
      }
    }

    window.addEventListener('hashchange', route);
    window.addEventListener('storage', (e) => { if (e.key === 'urca_bus' && !sbChannel) applyEvent(JSON.parse(e.newValue)); });

    function activateCloud() {
      const u = document.getElementById('sb-url').value.trim(); const k = document.getElementById('sb-key').value.trim();
      if(!u || !k) return alert("Inserisci URL e KEY"); localStorage.setItem('urca_cfg_v8', JSON.stringify({url: u, key: k})); connectCloud(u, k);
    }

    function connectCloud(u, k) {
      try {
        sbClient = supabase.createClient(u, k); sbChannel = sbClient.channel('urca-room', { config: { broadcast: { self: false } } });
        sbChannel.on('broadcast', { event: 'urca_evt' }, (e) => applyEvent(e.payload)).subscribe((status) => {
          if(status === 'SUBSCRIBED') {
            document.getElementById('sync-status').innerText = "☁️ CLOUD OK"; document.getElementById('sync-status').className = "text-[9px] font-mono px-2 py-0.5 rounded bg-green-100 text-green-800 border border-green-500";
            renderAdminLinks(u, k); 
            if(myView==='admin') emitEvent('LOG', {msg: "Regia connessa al Cloud."});
            else emitEvent('REQ_SYNC', {});
          }
        });
      } catch(e) {}
    }

    function renderAll(isNew = false) { if(myView==='admin') renderAdmin(); else renderTeam(isNew); }

    // ================== ADMIN ==================
    function showQR(url, tName) {
      const qrUrl = `https://quickchart.io/qr?text=${encodeURIComponent(url)}&size=350&margin=2`;
      document.getElementById('qr-table-name').innerText = tName; document.getElementById('qr-image').src = qrUrl; document.getElementById('qr-url-text').innerText = url;
      const m = document.getElementById('admin-qr-modal'); m.classList.remove('hidden'); m.classList.add('flex'); setTimeout(()=>m.classList.remove('opacity-0'), 10);
    }
    function closeQR() { const m = document.getElementById('admin-qr-modal'); m.classList.add('opacity-0'); setTimeout(()=>{m.classList.add('hidden');m.classList.remove('flex');}, 300); }

    function renderAdminLinks(u = '', k = '') {
      const base = window.location.href.split('#')[0].split('?')[0]; 
      let params = '';
      if(u && k && u !== "INCOLLA_QUI_IL_TUO_URL_PROJECT" && !document.getElementById('sb-url').value.includes('INCOLLA')) {
          // params = `?sUrl=${encodeURIComponent(u)}&sKey=${encodeURIComponent(k)}`;
      }
      
      const c = document.getElementById('ad-links-container'); if(!c) return;
      c.innerHTML = st.tables.map(t => {
        const url = `${base}${params}#${t.id}`;
        return `<div class="flex border border-[#1A1A1A] rounded overflow-hidden">
                  <a href="${url}" target="_blank" class="flex-1 p-1.5 hover:opacity-80 truncate" style="background-color: ${db[t.sc].bg}; color: ${db[t.sc].c}">${t.name}</a>
                  <button onclick="showQR('${url}', '${t.name}')" class="bg-gray-200 px-2 border-l border-[#1A1A1A] hover:bg-gray-300" title="Mostra QR Code">📱 QR</button>
                </div>`;
      }).join('');
    }

    function renderAdmin() {
      document.getElementById('ad-phase-idx').innerText = `FASE ${st.ph + 1}/4`; document.getElementById('ad-phase-name').innerText = fasi[st.ph].n; document.getElementById('ad-check-crash').checked = st.allowCrash;
      updateAdminTime(); renderLog(); renderAdminLinks(document.getElementById('sb-url').value, document.getElementById('sb-key').value);
      
      const cont = document.getElementById('ad-monitors');
      cont.innerHTML = st.tables.map(t => {
        const data = db[t.sc];
        let statusHtml = `<span class="text-gray-400 italic">Nessun imprevisto in corso.</span>`;
        if(t.act !== null) {
          const hSt = t.hist.find(x=>x.id===t.act)?.st || 'new';
          const icon = hSt === 'new' ? '🔒' : (hSt === 'unlocked' ? '🔓' : '✅');
          statusHtml = `<span class="font-bold text-[#FF5A36] block mb-1">CARTA ATTIVA:</span><span class="font-display font-bold leading-tight block">${icon} ${data.imp[t.act].f}</span>
                        ${hSt==='new' ? `<button onclick="adminUnlock('${t.id}')" class="mt-2 bg-[#1A1A1A] text-white text-[9px] px-2 py-1.5 rounded w-full hover:bg-gray-800 transition">SBLOCCA E MOSTRA HINT 🔓</button>` : ''}`;
        }
        
        let stor = `<div class="mt-2 text-[9px] font-mono text-gray-500">Storico Vuoto</div>`;
        if(t.hist.length > 0) {
          stor = `<div class="mt-2 text-[9px] font-mono text-gray-500">Inventory: ${t.hist.map(h => (h.st==='survived'?'✅':(h.st==='unlocked'?'🔓':'🔒')) + data.imp[h.id].f).join(', ')}</div>`;
        }

        return `<div class="bg-white retro-border rounded-xl p-3 flex flex-col shadow-sm"><div class="border-b-2 border-[#1A1A1A] pb-2 flex justify-between items-center mb-2"><h3 class="font-display font-bold text-sm" style="color: ${data.c}">${data.ico.replace('sm:w-14 sm:h-14', '').replace('w-12 h-12', 'w-4 h-4 inline-block mr-1')} ${t.name}</h3><button onclick="adminDelTable('${t.id}')" class="text-red-500 hover:text-red-700 font-bold text-xs">✕</button></div><div class="text-xs bg-gray-50 p-2 rounded border border-gray-200 flex-1 flex flex-col justify-between"><div>${statusHtml}</div>${stor}</div><div class="flex gap-1 mt-2"><button onclick="adminShock('${t.id}')" class="flex-1 bg-[#FF5A36] text-white font-display text-[10px] font-bold py-2 rounded border border-[#1A1A1A] retro-btn hover:bg-[#e44e2c]">💥 SHOCK</button></div></div>`;
      }).join('');

      const b = document.getElementById('ad-btn-play');
      b.innerText = st.run ? "PAUSA" : "PLAY"; b.className = st.run ? "retro-btn bg-yellow-300 text-[10px] font-bold py-2 rounded-lg retro-border" : "retro-btn bg-green-300 text-[10px] font-bold py-2 rounded-lg retro-border";
    }

    function renderLog() {
      if(myView !== 'admin') return; const term = document.getElementById('ad-terminal');
      term.innerHTML = st.logs.map(l => `<div class="mb-1.5"><span class="text-green-500">➔</span> ${l}</div>`).join(''); term.scrollTop = term.scrollHeight;
    }

    function updateAdminTime() { const el = document.getElementById('ad-timer-txt'); if(el) el.innerText = `${Math.floor(st.tr/60).toString().padStart(2,'0')}:${(st.tr%60).toString().padStart(2,'0')}`; }
    function adminToggleTimer() {
      if(st.run) { clearInterval(timerInt); emitEvent('T_CTRL', { run: false, ph: st.ph, t: st.tr, log: 'Timer Pausa.' }); }
      else { clearInterval(timerInt); timerInt = setInterval(() => { if(st.tr>0) emitEvent('TICK', { t: st.tr-1 }); else { clearInterval(timerInt); emitEvent('T_CTRL', { run:false, ph:st.ph, t:0, log:'Tempo Scaduto!' }); } }, 1000); emitEvent('T_CTRL', { run:true, ph:st.ph, t:st.tr, log:`Timer Avviato: ${fasi[st.ph].n}` }); }
    }
    function adminNavPhase(d) { const p = (st.ph + d + fasi.length) % fasi.length; clearInterval(timerInt); emitEvent('T_CTRL', { run:false, ph:p, t:fasi[p].t, log:`Fase: ${fasi[p].n}` }); }
    function adminResetTimer() { clearInterval(timerInt); emitEvent('T_CTRL', { run:false, ph:st.ph, t:fasi[st.ph].t, log:'Timer resettato.' }); }
    function adminToggleFeature(k, v) { emitEvent('CFG', { ac: v, log: `Sblocco team shock autonomo: ${v}`}); }
    function adminAddTable() { const n = document.getElementById('new-t-name').value.trim() || `Tavolo ${st.tables.length + 1}`; const sc = document.getElementById('new-t-scen').value; const id = 't' + Date.now().toString().slice(-4); document.getElementById('new-t-name').value = ''; emitEvent('ADD_T', { id, n, sc }); }
    function adminDelTable(id) { if(confirm('Eliminare tavolo?')) emitEvent('DEL_T', { id }); }
    function adminUnlock(tid) { emitEvent('UNLOCK', { tid, log: `Regia ha SBLOCCATO hint per tavolo ${tid}`}); }
    function adminReplySOS(tid, el) { emitEvent('SOS_REPLY', { tid, log: `Regia ha risposto alla richiesta SOS di ${tid}` }); el.remove(); }
    
    function getAvailCards(tid) { const t = st.tables.find(x => x.id === tid); const total = db[t.sc].imp.length; return Array.from({length:total}, (_, i)=>i).filter(i => !t.hist.some(h=>h.id === i)); }
    function adminShock(tid) {
      const avail = getAvailCards(tid); const t = st.tables.find(x => x.id === tid);
      if(avail.length === 0) return alert(`Il tavolo ${t.name} ha esaurito le carte!`);
      const i = avail[Math.floor(Math.random() * avail.length)]; emitEvent('SHOCK', { tid, imp: i, flip: false, log: `💥 SHOCK Regia su [${t.name}] ➔ ${db[t.sc].imp[i].f}` });
    }
    function clearLogs() { emitEvent('CLR', {}); }

    // ================== TEAM (MOBILE FIRST) ==================
    function getT() { return st.tables.find(x => x.id === myView); }
    function hideOnboarding() { document.getElementById('tm-onboarding').classList.add('opacity-0', 'pointer-events-none'); locUI.hasRevealed = true; renderTeam(); }
    function sendSOS() { emitEvent('SOS', { tid: myView }); }

    function renderTeam(isNewShock = false) {
      const t = getT(); if(!t) { document.body.innerHTML = `<div class="h-screen flex items-center justify-center font-display text-2xl">Tavolo non valido. Ricarica la pagina.</div>`; return; }
      if(locUI.hasRevealed) document.getElementById('tm-onboarding').classList.add('hidden');
      
      const d = db[t.sc];
      document.getElementById('tm-view-id').innerText = t.name.toUpperCase(); document.getElementById('tm-title').innerText = d.cx_f.t; document.getElementById('tm-target').innerText = d.tgt;

      if(!document.getElementById('ctx-f').hasAttribute('data-rendered')) {
        document.getElementById('ctx-f').innerHTML = `<div class="flex justify-between items-center w-full"><span class="font-display font-bold text-[10px] bg-[#1A1A1A] text-white px-2 py-0.5 rounded tracking-widest">${d.tg}</span></div><div class="flex-1 flex flex-col justify-center text-center">${d.ico}<h3 class="font-display text-xl sm:text-2xl font-bold mt-4 leading-tight">${d.cx_f.t}</h3><p class="text-xs sm:text-sm text-gray-500 font-medium mt-2 px-2 leading-relaxed">${d.cx_f.d}</p></div><div class="border-t-2 border-[#1A1A1A] pt-3 text-left"><p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-1">Target</p><p class="text-xs sm:text-sm font-display font-bold">${d.tgt.split('- ')[1]}</p></div>`;
        document.getElementById('ctx-b').innerHTML = `<div class="border-b-2 border-[#1A1A1A] pb-3 text-sm sm:text-base font-display font-bold">${d.t.toUpperCase()}</div><div class="flex-1 flex flex-col justify-center gap-4 text-xs sm:text-sm mt-4"><div><span class="font-bold text-gray-500 text-[10px] block uppercase tracking-wider mb-1">${d.cx_b.t1}</span><p class="leading-relaxed">${d.cx_b.d1}</p></div><div class="pt-4 border-t-2 border-dashed border-gray-300"><span class="font-bold text-[#FF5A36] text-[10px] block uppercase tracking-wider mb-1">${d.cx_b.t2}</span><p class="leading-relaxed font-bold">${d.cx_b.d2}</p></div></div>`;
        document.getElementById('ctx-f').setAttribute('data-rendered', 'true');

            const icon = h.st === 'new' ? '🔒' : (h.st === 'unlocked' ? '🔓' : '✅');
            return `<button onclick="teamViewOld(${h.id})" class="flex-shrink-0 text-xs font-bold px-3 py-2 rounded-lg border-2 retro-btn transition-colors whitespace-nowrap snap-center ${t.act === h.id ? 'bg-[#1A1A1A] text-white border-[#1A1A1A]' : 'bg-gray-100 text-gray-700 border-gray-300'}">${icon} ${d.imp[h.id].f}</button>`
        }).join('');
      } else invBox.classList.add('hidden');

      document.getElementById('tm-btn-self').classList.toggle('hidden', !st.allowCrash);
      const avail = getAvailCards(t.id);
      if(avail.length===0 && st.allowCrash) { document.getElementById('tm-btn-self').innerText = "ESUARITE"; document.getElementById('tm-btn-self').disabled = true; document.getElementById('tm-btn-self').classList.add('opacity-50'); } 
      else { document.getElementById('tm-btn-self').innerHTML = "🚨 Nuova Carta"; document.getElementById('tm-btn-self').disabled = false; document.getElementById('tm-btn-self').classList.remove('opacity-50'); }

      const w = document.getElementById('tm-wrapper-imp'); const c = document.getElementById('tm-card-imp');
      if (t.act !== null) {
        w.classList.remove('hidden');
        setTimeout(() => { if(!locUI.hidden) { w.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4'); } }, 10);

        const iData = d.imp[t.act]; const hSt = t.hist.find(x=>x.id===t.act).st;
        const isBlur = hSt === 'new'; const isSurvived = hSt === 'survived';
        
        let backContent = `
          <div><span class="text-gray-500 font-bold text-[10px] block uppercase tracking-wider mb-1">${iData.b1}</span><p class="text-xs sm:text-sm leading-relaxed">${iData.bd1}</p></div>
          <div class="pt-3 border-t-2 border-dashed border-gray-300 relative flex-1 flex flex-col">
            <span class="text-[#FF5A36] font-bold text-[10px] block uppercase tracking-wider mb-1">${iData.b2}</span>
            <div class="${isBlur ? 'blur-content' : ''} flex-1"><p class="font-bold bg-yellow-50 p-3 border-2 border-yellow-200 rounded-lg text-[#1A1A1A] text-xs sm:text-sm leading-relaxed shadow-inner">${isBlur ? iData.bd2 : "💡 <i>Se non ci avevate pensato prima...</i><br>" + iData.hint}</p></div>
            ${isBlur ? `<div class="absolute inset-0 flex flex-col items-center justify-center bg-white/40 backdrop-blur-sm rounded-lg"><input type="text" id="pw-input-${t.act}" onclick="event.stopPropagation()" placeholder="Password" class="w-32 text-base text-center border-2 border-[#1A1A1A] p-2 rounded-lg mb-2 shadow-inner outline-none focus:border-[#FF5A36]"><button onclick="checkPw(${t.act}, event)" class="bg-[#1A1A1A] text-white text-xs font-bold px-4 py-2 rounded-lg hover:bg-gray-800 transition-transform active:scale-95 shadow-md">SBLOCCA 🔓</button></div>` : ''}
            ${!isBlur && !isSurvived ? `<button onclick="teamSurvive(${t.act}, event)" class="w-full mt-auto bg-green-500 text-white font-display font-bold py-3 rounded-xl border-2 border-[#1A1A1A] retro-shadow-sm text-xs sm:text-sm active:translate-y-1 transition-transform">SFIDA DOMINATA ✅</button>` : ''}
            ${isSurvived ? `<div class="w-full mt-auto bg-white text-green-600 border-2 border-green-500 font-display font-bold py-3 rounded-xl text-center text-xs sm:text-sm transform -rotate-2 shadow-sm">DOMINATO ✅</div>` : ''}
          </div>
        `;

        const f = `<div class="flex justify-between w-full"><span class="font-display text-[10px] bg-[#FF5A36] text-white px-2 py-1 rounded-full retro-border">CRASH TEST</span></div><div class="flex-1 flex flex-col justify-center text-center items-center py-2"><div class="w-12 h-12 bg-[#1A1A1A] text-white rounded-full flex items-center justify-center font-display text-2xl mb-3 shadow-md">!</div><h3 class="font-display text-lg sm:text-xl font-bold leading-tight mb-3">${iData.f}</h3><div class="bg-[#FDFBF7] p-3 rounded-xl border-2 border-[#1A1A1A] text-xs sm:text-sm font-semibold leading-relaxed shadow-inner">"${iData.d}"</div></div>`;
        const b = `<div class="border-b-2 border-gray-200 pb-2 flex justify-between"><span class="text-xs sm:text-sm font-display font-bold truncate pr-2">${iData.f.toUpperCase()}</span><span class="bg-[#FF5A36] text-white text-[9px] px-2 py-1 rounded">DOMANDA</span></div><div class="flex-1 flex flex-col pt-3 gap-3">${backContent}</div>`;
        
        document.getElementById('imp-f').innerHTML = f; document.getElementById('imp-b').innerHTML = b;
        if(locUI.zoomType === 'imp') { document.getElementById('mod-f').innerHTML = f; document.getElementById('mod-b').innerHTML = b; }
        
        if(isNewShock && !locUI.hidden && locUI.hasRevealed) { document.body.classList.add('alarm-active'); setTimeout(()=>document.body.classList.remove('alarm-active'), 800); playSound('alarm'); }
        
        if (locUI.hidden) { w.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4'); document.getElementById('tm-badge-restore').classList.remove('hidden'); }
        else { document.getElementById('tm-badge-restore').classList.add('hidden'); }

        c.classList.toggle('flipped', t.flip); 
        if(locUI.zoomType === 'imp') document.getElementById('modal-inner').classList.toggle('flipped', t.flip);

      } else { 
        w.classList.add('hidden', 'opacity-0', 'pointer-events-none', 'translate-y-4'); document.getElementById('tm-badge-restore').classList.add('hidden'); 
      }

      // Sync Context modal
      if(locUI.zoomType === 'ctx') {
        document.getElementById('mod-f').innerHTML = document.getElementById('ctx-f').innerHTML;
        document.getElementById('mod-b').innerHTML = document.getElementById('ctx-b').innerHTML;
        document.getElementById('modal-inner').classList.toggle('flipped', ctxFlip);
      }
    }

    function updateTeamTime() { const box = document.getElementById('tm-timer'); if(st.run || st.tr < fasi[st.ph].t) { box.classList.remove('hidden'); box.innerText = `${Math.floor(st.tr/60).toString().padStart(2,'0')}:${(st.tr%60).toString().padStart(2,'0')}`; } else box.classList.add('hidden'); }
    
    let ctxFlip = false; 
    function teamFlipCtx() { ctxFlip = !ctxFlip; document.getElementById('tm-card-ctx').classList.toggle('flipped', ctxFlip); if(locUI.zoomType==='ctx') document.getElementById('modal-inner').classList.toggle('flipped', ctxFlip); }
    
    function checkPw(imp, e) { e.stopPropagation(); const val = document.getElementById('pw-input-'+imp)?.value; if(val && val.toLowerCase() === 'urca-rischio') { emitEvent('UNLOCK', { tid: myView, log: `Il tavolo ha decifrato la password!` }); playSound('win'); } else alert("Password errata!"); }
    function teamSurvive(imp, e) { e.stopPropagation(); playSound('win'); emitEvent('SURVIVE', { tid: myView, log: `✅ Sfida Dominata!` }); }

    function teamSelfShock() { const t = getT(); const avail = getAvailCards(t.id); if(avail.length===0) return; const i = avail[Math.floor(Math.random()*avail.length)]; locUI.hidden=false; emitEvent('SHOCK', {tid: t.id, imp: i, flip: false, log: `Pescata autonoma ➔ ${db[t.sc].imp[i].f}`}); }
    function teamViewOld(impIdx) { locUI.hidden = false; emitEvent('VIEW', {tid: myView, imp: impIdx}); }
    function teamHide(val) { locUI.hidden = val; renderTeam(); }
    function teamZoom(val, type = 'imp') { 
      const m = document.getElementById('modal-zoom'); 
      if(val) { 
        locUI.zoomType = type; renderTeam();
        m.classList.remove('hidden'); m.classList.add('flex'); setTimeout(()=>m.classList.remove('opacity-0'), 10); 
      } else { m.classList.add('opacity-0'); setTimeout(()=>{m.classList.add('hidden');m.classList.remove('flex');}, 300); } 
    }
    function teamFlipImp() { const t = getT(); emitEvent('FLIP', {tid: t.id, flip: !t.flip}); }
    function teamFlipModal() { if(locUI.zoomType === 'ctx') teamFlipCtx(); else teamFlipImp(); }

    window.onload = init;
  </script>
</body>
</html>
