    .retro-shadow-sm { box-shadow: 3px 3px 0px 0px #1A1A1A; }
    .retro-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px 0px #1A1A1A; }
    
    /* Layout Mobile First */
    .aspect-card { aspect-ratio: 63 / 88; width: 100%; max-width: 340px; margin: 0 auto; }
    .card-perspective { perspective: 1200px; width: 100%; }
    .card-inner { width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; position: relative; }
    .card-inner.flipped { transform: rotateY(180deg); }
    .card-front, .card-back { backface-visibility: hidden; position: absolute; top:0; left:0; width:100%; height:100%; border-radius:24px; }
    .card-back { transform: rotateY(180deg); }

    /* Fix Scroll & Z-index */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .blur-content { filter: blur(6px); user-select: none; pointer-events: none; opacity: 0.4; }

    @keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.5); opacity: 0; } }
    .sos-pulse::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: #fbbf24; animation: pulse-ring 2s infinite; z-index: -1; }
    @keyframes slide-in-top { 0% { transform: translateY(-100%) translateX(-50%); opacity: 0; } 100% { transform: translateY(0) translateX(-50%); opacity: 1; } }
    .toast-anim { animation: slide-in-top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

  <script>
    function playSound(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination);
        if(type === 'alarm') {
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(140, ctx.currentTime); osc.frequency.linearRampToValueAtTime(320, ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.2, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5); osc.start(); osc.stop(ctx.currentTime + 0.5);
        } else if(type === 'sos') {
          osc.type = 'sine'; osc.frequency.setValueAtTime(880, ctx.currentTime); osc.frequency.setValueAtTime(1100, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.5); osc.start(); osc.stop(ctx.currentTime + 0.5);
        } else if(type === 'win') {
          osc.type = 'square'; osc.frequency.setValueAtTime(440, ctx.currentTime); osc.frequency.setValueAtTime(660, ctx.currentTime + 0.1); osc.frequency.setValueAtTime(880, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4); osc.start(); osc.stop(ctx.currentTime + 0.4);
        }
      } catch(e) {}
    }
  </script>

          imprevisto: { f: 'Il Dottore Sconosciuto', d: '<i>"Mi sono appena collegato per la mia seduta, ma il link mi ha mandato nella stanza virtuale di un dottore che non ho mai visto! Non voglio ricominciare da capo... Dov\'è la mia psicologa?!"</i><br><br><span class="text-[9px] font-mono bg-red-200 text-red-800 px-2 py-0.5 rounded retro-border">🚨 ROTTURA FIDUCIA</span>', b1: '🚧 L\'IMPREVISTO', bd1: 'Bug tecnico che si trasforma in violazione dell\'intimità.', b2: 'CRASH TEST', bd2: 'Come si chiede scusa per un bug IT quando in gioco c\'è la salute mentale?', hint: 'Nessun tono da "Customer Care IT". Validazione rabbia utente, rassicurazione sui dati e contatto umano telefonico immediato.' },
          limite: { f: 'Scorciatoia Fai-Da-Te', d: '<i>"Ho visto che il primo appuntamento è tra tre giorni, ma io devo dormire stanotte o domani crollo in ufficio. Dimmi quale ansiolitico o sonnifero posso comprare senza ricetta."</i><br><br><span class="text-[9px] font-mono bg-[#1A1A1A] text-white px-2 py-0.5 rounded retro-border">🛑 RISCHIO MEDICO</span>', b1: '🛑 IL LIMITE', bd1: 'L\'utente delega all\'AI un parere farmacologico.', b2: 'CRASH TEST', bd2: 'Come si nega il farmaco senza far sentire l\'utente abbandonato?', hint: 'Disclaimer netto sulle medicine, controbilanciato dall\'invio immediato di una risorsa audio (rumore bianco/respirazione) per la notte.' }
        }
      }
    };
  </script>

  <script>
    // =================================================================
    // 🟢 INCOLLA QUI LE TUE CHIAVI SUPABASE TRA LE VIRGOLETTE
    // =================================================================
    const MY_SUPABASE_URL = "INCOLLA_QUI_IL_TUO_URL_PROJECT"; 
    const MY_SUPABASE_KEY = "INCOLLA_QUI_LA_TUA_ANON_KEY";
    // =================================================================

    let st = {
      tr: 600, run: false, allowCrash: false, logs: [],
      tables: [] // Array vuoto, si popola dal generatore
    };
    
    let locUI = { hidden: false, zoomType: 'ctx', hasRevealed: false };
    let sbClient = null, sbChannel = null, timerInt = null, myView = 'admin';

    function safeGetStorage(key) { try { return localStorage.getItem(key); } catch(e) { return null; } }
    function safeSetStorage(key, val) { try { localStorage.setItem(key, val); } catch(e) {} }

    function emitEvent(type, payload) {
      const evt = { type, payload, ts: Date.now() }; applyEvent(evt);
      if (sbChannel) sbChannel.send({ type: 'broadcast', event: 'urca_evt', payload: evt });
      else safeSetStorage('urca_bus', JSON.stringify(evt));
    }

    function applyEvent(e) {
      const p = e.payload;
      switch(e.type) {
        case 'TICK': st.tr = p.t; if(myView==='admin') updateAdminTime(); else updateTeamTime(); break;
        case 'T_CTRL': st.run = p.run; st.tr = p.t; if(p.log) pushLog(p.log); renderAll(); break;
        case 'CFG': st.allowCrash = p.ac; if(p.log) pushLog(p.log); renderAll(); break;
        case 'ADD_T': st.tables.push({ id: p.id, name: p.n, sc: p.sc, hist: [], act: null, flip: false }); pushLog(`Creato ${p.n}`); renderAll(); break;
        case 'DEL_T': st.tables = st.tables.filter(x => x.id !== p.id); pushLog(`Rimosso ${p.id}`); renderAll(); break;
        case 'ASSIGN': 
          let ts = st.tables.find(x => x.id === p.tid); if(!ts) break;
          ts.act = p.k; ts.flip = p.flip;
          if(!ts.hist.some(h => h.id === p.k)) { ts.hist.push({id: p.k, st: 'new'}); p.isNew = true; }
          if(p.log) pushLog(p.log); renderAll(p.isNew); break;
        case 'VIEW':
          let tv = st.tables.find(x => x.id === p.tid); if(tv) { tv.act = p.k; tv.flip = false; } renderAll(); break;
        case 'FLIP': 
          let tf = st.tables.find(x => x.id === p.tid); if(tf) tf.flip = p.flip; renderAll(); break;
        case 'UNLOCK':
          let tu = st.tables.find(x => x.id === p.tid);
          if(tu) { let h = tu.hist.find(x=>x.id===tu.act); if(h) h.st = 'unlocked'; }
          if(p.log) pushLog(p.log); renderAll(); break;
        case 'SURVIVE':
          let tsv = st.tables.find(x => x.id === p.tid);
          if(tsv) { let h = tsv.hist.find(x=>x.id===tsv.act); if(h) h.st = 'survived'; }
          if(p.log) pushLog(p.log); renderAll(); break;
        case 'SOS':
          if(myView==='admin') {
            const tn = st.tables.find(x=>x.id===p.tid)?.name || 'Tavolo'; playSound('sos');
            const toast = document.createElement('div'); toast.className = 'bg-yellow-400 border-4 border-[#1A1A1A] p-4 rounded-xl shadow-lg flex items-center gap-4 toast-anim';
            toast.innerHTML = `<span class="text-3xl">🆘</span><div class="flex-1"><p class="font-display font-bold text-lg leading-tight">${tn}</p><p class="text-xs font-mono">Richiede assistenza al tavolo.</p></div><button class="bg-[#1A1A1A] text-white px-4 py-2 rounded-lg text-sm hover:bg-gray-800 font-bold" onclick="adminReplySOS('${p.tid}', this.parentElement)">ARRIVO 🏃‍♂️</button>`;
            document.getElementById('admin-toasts').appendChild(toast);
          }
          break;
        case 'SOS_REPLY':
          if(myView === p.tid) {
            playSound('win');
            const toast = document.createElement('div'); toast.className = 'bg-green-400 border-4 border-[#1A1A1A] px-5 py-4 rounded-xl shadow-2xl flex items-center justify-center gap-3 toast-anim w-full';
            toast.innerHTML = '<span class="text-3xl">🏃‍♂️</span><p class="font-display font-bold text-lg text-[#1A1A1A]">Il facilitatore sta arrivando!</p>';
            document.getElementById('tm-toasts').appendChild(toast); setTimeout(() => toast.remove(), 5000);
          }
          break;
        case 'LOG': pushLog(p.msg); renderLog(); break;
        case 'CLR': st.logs = []; renderLog(); break;
        case 'REQ_SYNC': if(myView==='admin') emitEvent('FULL_SYNC', { state: st }); break;
        case 'FULL_SYNC': st = p.state; renderAll(); break;
      }
      safeSetStorage('urca_state_v9', JSON.stringify(st));
    }

    function pushLog(m) { const t = new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); st.logs.push(`[${t}] ${m}`); if(st.logs.length > 50) st.logs.shift(); }

    function init() {
      const bkp = safeGetStorage('urca_state_v9');
      if (bkp) { try { let saved = JSON.parse(bkp); if(saved.tables) st = saved; } catch(e) {} }
      
      const params = new URLSearchParams(window.location.search);
      let savedCfg = {}; try { savedCfg = JSON.parse(safeGetStorage('urca_cfg_v9') || '{}'); } catch(e) {}
      const url = params.get('sUrl') || savedCfg.url || MY_SUPABASE_URL;
      const key = params.get('sKey') || savedCfg.key || MY_SUPABASE_KEY;
      
      if (url && key && url !== "INCOLLA_QUI_IL_TUO_URL_PROJECT") { 
        if(document.getElementById('sb-url')) document.getElementById('sb-url').value = url; 
        if(document.getElementById('sb-key')) document.getElementById('sb-key').value = key; 
        connectCloud(url, key); 
      }
      route();
    }

    function route() {
      const hash = window.location.hash || '#admin';
      const vAdmin = document.getElementById('view-admin'); const vTeam = document.getElementById('view-team');
      if(vAdmin) { vAdmin.classList.add('hidden'); vAdmin.classList.remove('flex'); }
      if(vTeam) { vTeam.classList.add('hidden'); vTeam.classList.remove('flex'); }
      
      if (hash === '#admin') { 
        myView = 'admin'; 
        if(vAdmin) { vAdmin.classList.remove('hidden'); vAdmin.classList.add('flex'); }
        renderAdmin(); 
      } else { 
        myView = hash.replace('#', ''); 
        if(vTeam) { vTeam.classList.remove('hidden'); vTeam.classList.add('flex'); }
        if (!sbChannel) emitEvent('REQ_SYNC', {}); 
        renderTeam(); 
      }
    }

    window.addEventListener('hashchange', route);
    window.addEventListener('storage', (e) => { if (e.key === 'urca_bus' && !sbChannel) { try { applyEvent(JSON.parse(e.newValue)); } catch(err){} } });

    function activateCloud() {
      const u = document.getElementById('sb-url').value.trim(); const k = document.getElementById('sb-key').value.trim();
      if(!u || !k) return alert("Inserisci URL e KEY"); safeSetStorage('urca_cfg_v9', JSON.stringify({url: u, key: k})); connectCloud(u, k);
    }

    function connectCloud(u, k) {
      try {
        if(typeof supabase === 'undefined') return;
        sbClient = supabase.createClient(u, k); sbChannel = sbClient.channel('urca-room', { config: { broadcast: { self: false } } });
        sbChannel.on('broadcast', { event: 'urca_evt' }, (e) => applyEvent(e.payload)).subscribe((status) => {
          if(status === 'SUBSCRIBED') {
            const ss = document.getElementById('sync-status');
            if(ss) { ss.innerText = "☁️ CLOUD OK"; ss.className = "text-[9px] font-mono px-2 py-0.5 rounded bg-green-100 text-green-800 border border-green-500"; }
            if(myView==='admin') emitEvent('LOG', {msg: "Regia connessa al Cloud."}); else emitEvent('REQ_SYNC', {});
          }
        });
      } catch(e) {}
    }

    function renderAll(isNew = false) { if(myView==='admin') renderAdmin(); else renderTeam(isNew); }

    // ================== ADMIN FUNCTIONS ==================
    function showQR(url, tName) {
      const qrUrl = `https://quickchart.io/qr?text=${encodeURIComponent(url)}&size=350&margin=2`;
      document.getElementById('qr-table-name').innerText = tName; document.getElementById('qr-image').src = qrUrl;
      const m = document.getElementById('admin-qr-modal'); m.classList.remove('hidden'); m.classList.add('flex'); setTimeout(()=>m.classList.remove('opacity-0'), 10);
    }
    function closeQR() { const m = document.getElementById('admin-qr-modal'); m.classList.add('opacity-0'); setTimeout(()=>{m.classList.add('hidden');m.classList.remove('flex');}, 300); }

    function renderAdmin() {
      const vAdmin = document.getElementById('view-admin'); if(!vAdmin || vAdmin.classList.contains('hidden')) return;
      updateAdminTime(); renderLog(); 
      document.getElementById('ad-check-crash').checked = st.allowCrash;
      
      const cont = document.getElementById('ad-monitors');
      if(cont) {
        cont.innerHTML = st.tables.map(t => {
          const data = db[t.sc];
          let statusHtml = `<div class="p-3 bg-gray-100 rounded text-center text-gray-400 font-mono text-[10px]">Nessuna carta attiva</div>`;
          
          if(t.act !== null) {
            const card = data.cards[t.act];
            const hSt = t.hist.find(x=>x.id===t.act)?.st || 'new';
            const statusBadge = hSt === 'new' ? '<span class="bg-[#1A1A1A] text-white px-2 py-0.5 rounded text-[8px]">🔒 DA RISOLVERE</span>' : (hSt === 'unlocked' ? '<span class="bg-blue-500 text-white px-2 py-0.5 rounded text-[8px]">🔓 HINT SVELATO</span>' : '<span class="bg-green-500 text-white px-2 py-0.5 rounded text-[8px]">✅ DOMINATA</span>');
            
            statusHtml = `
              <div class="border-2 border-[#1A1A1A] p-2 rounded-lg bg-white shadow-sm flex flex-col gap-1">
                <div class="flex justify-between items-center w-full">
                  <span class="font-bold text-[#FF5A36] text-[9px] uppercase">${t.act} IN CORSO</span>
                  ${statusBadge}
                </div>
                <div class="font-display font-bold text-sm leading-tight">${card.f}</div>
                ${hSt==='new' ? `<button onclick="adminUnlock('${t.id}')" class="mt-1 bg-blue-100 text-blue-800 border border-blue-300 text-[9px] px-2 py-1 rounded w-full font-bold hover:bg-blue-200">🔓 FORZA SBLOCCO HINT AI TEAM</button>` : ''}
              </div>`;
          }
          
          const keys = ['sfida', 'imprevisto', 'limite'];
          const buttonsHtml = keys.map(k => {
            const isDone = t.hist.some(h=>h.id===k);
            const label = k.charAt(0).toUpperCase() + k.slice(1);
            if(isDone) return `<button disabled class="flex-1 bg-gray-100 text-gray-400 border border-gray-300 text-[9px] font-bold py-1.5 rounded cursor-not-allowed line-through">${label}</button>`;
            return `<button onclick="adminAssign('${t.id}', '${k}')" class="flex-1 bg-[#1A1A1A] text-white border border-[#1A1A1A] text-[9px] font-bold py-1.5 rounded hover:bg-gray-800 retro-btn">${label}</button>`;
          }).join('');

          return `
            <div class="bg-white retro-border rounded-xl p-3 flex flex-col shadow-sm h-full">
              <div class="flex justify-between items-center mb-3 border-b-2 border-gray-200 pb-2">
                <div class="flex items-center gap-2">
                  <div class="w-6 h-6 rounded bg-[#FDFBF7] flex items-center justify-center border border-[#1A1A1A]">${data.ico.replace('sm:w-14 sm:h-14 w-12 h-12 mx-auto', 'w-4 h-4')}</div>
                  <div>
                    <h3 class="font-display font-bold text-xs" style="color: ${data.c}">${t.name}</h3>
                    <div class="flex gap-1 mt-0.5">
                      <a href="?#${t.id}" target="_blank" class="text-[8px] bg-gray-100 px-1 rounded hover:bg-gray-200">Apri Monitor ↗</a>
                      <button onclick="showQR('?#${t.id}', '${t.name}')" class="text-[8px] bg-gray-100 px-1 rounded hover:bg-gray-200">QR 📱</button>
                    </div>
                  </div>
                </div>
                <button onclick="adminDelTable('${t.id}')" class="text-gray-400 hover:text-red-500 font-bold text-sm">✕</button>
              </div>
              
              <div class="flex-1 flex flex-col gap-2">
                ${statusHtml}
              </div>
              
              <div class="mt-3 pt-2 border-t-2 border-dashed border-gray-200">
                <span class="text-[8px] font-mono text-gray-500 mb-1 block uppercase">Invia Carta Specifica:</span>
                <div class="flex gap-1 w-full">
                  ${buttonsHtml}
                </div>
                <button onclick="adminAssignRandom('${t.id}')" class="w-full mt-1 bg-yellow-300 text-yellow-900 border border-[#1A1A1A] text-[9px] font-bold py-1.5 rounded hover:bg-yellow-400 retro-btn">🎲 Estrai Randomica</button>
              </div>
            </div>`;
        }).join('');
      }

      const b = document.getElementById('ad-btn-play');
      if(b) {
        b.innerHTML = st.run ? "⏸ PAUSA" : "▶ START TIMER"; 
        b.className = st.run ? "retro-btn bg-yellow-300 text-[11px] font-bold py-2 rounded-lg retro-border" : "retro-btn bg-green-300 text-[11px] font-bold py-2 rounded-lg retro-border";
      }
    }

    function renderLog() {
      if(myView !== 'admin') return; const term = document.getElementById('ad-terminal');
      if(term) { term.innerHTML = st.logs.map(l => `<div class="mb-1"><span class="text-green-500">➔</span> ${l}</div>`).join(''); term.scrollTop = term.scrollHeight; }
    }

    function updateAdminTime() { const el = document.getElementById('ad-timer-txt'); if(el) el.innerText = `${Math.floor(st.tr/60).toString().padStart(2,'0')}:${(st.tr%60).toString().padStart(2,'0')}`; }
    
    function adminToggleTimer() {
      if(st.run) { clearInterval(timerInt); emitEvent('T_CTRL', { run: false, ph: st.ph, t: st.tr, log: 'Timer in Pausa.' }); }
      else { clearInterval(timerInt); timerInt = setInterval(() => { if(st.tr>0) emitEvent('TICK', { t: st.tr-1 }); else { clearInterval(timerInt); emitEvent('T_CTRL', { run:false, ph:st.ph, t:0, log:'Tempo Scaduto!' }); } }, 1000); emitEvent('T_CTRL', { run:true, ph:st.ph, t:st.tr, log:`Timer Avviato.` }); }
    }
    function adminSetCustomTimer() {
      const min = parseInt(document.getElementById('custom-min').value);
      if(!isNaN(min) && min > 0) { clearInterval(timerInt); emitEvent('T_CTRL', { run: false, ph: st.ph, t: min * 60, log: `Timer impostato a ${min} minuti.` }); document.getElementById('custom-min').value = ''; }
    }
    function adminResetTimer() { clearInterval(timerInt); emitEvent('T_CTRL', { run:false, ph:st.ph, t:fasi[0].t, log:'Timer resettato a 10:00.' }); }
    
    function adminToggleFeature(k, v) { emitEvent('CFG', { ac: v, log: `Modalità Random libera ai Team: ${v ? 'ATTIVATA' : 'DISATTIVATA'}`}); }
    function adminAddTable() { const n = document.getElementById('new-t-name').value.trim() || `Tavolo ${st.tables.length + 1}`; const sc = document.getElementById('new-t-scen').value; const id = 't' + Date.now().toString().slice(-4); document.getElementById('new-t-name').value = ''; emitEvent('ADD_T', { id, n, sc }); }
    function adminDelTable(id) { if(confirm('Eliminare questo tavolo e tutti i suoi dati?')) emitEvent('DEL_T', { id }); }
    
    function adminAssign(tid, key) {
      const t = st.tables.find(x => x.id === tid);
      if(t.hist.some(h=>h.id === key)) return alert('Questa carta è già stata affrontata dal team.');
      emitEvent('ASSIGN', { tid, k: key, flip: false, log: `Regia ha inviato [${key.toUpperCase()}] al ${t.name}` });
    }
    function adminAssignRandom(tid) {
      const t = st.tables.find(x => x.id === tid);
      const keys = ['sfida', 'imprevisto', 'limite'];
      const avail = keys.filter(k => !t.hist.some(h=>h.id === k));
      if(avail.length === 0) return alert('Carte esaurite per questo tavolo.');
      const rKey = avail[Math.floor(Math.random() * avail.length)];
      emitEvent('ASSIGN', { tid, k: rKey, flip: false, log: `Regia ha inviato Random [${rKey.toUpperCase()}] al ${t.name}` });
    }
    
    function adminUnlock(tid) { emitEvent('UNLOCK', { tid, log: `Regia ha sbloccato la soluzione per il ${tid}`}); }
    function adminReplySOS(tid, el) { emitEvent('SOS_REPLY', { tid, log: `Regia in arrivo al ${tid}` }); el.remove(); }
    function clearLogs() { emitEvent('CLR', {}); }

    // ================== TEAM (MOBILE FIRST) ==================
    function getT() { return st.tables.find(x => x.id === myView); }
    function hideOnboarding() { document.getElementById('tm-onboarding').classList.add('opacity-0', 'pointer-events-none'); locUI.hasRevealed = true; renderTeam(); }
    function sendSOS() { emitEvent('SOS', { tid: myView }); }

    function getCardHtml(type, content, flipFuncStr, zoomFuncStr) {
      return `
        <div class="card-front bg-[#FDFBF7] retro-border p-6 flex flex-col riso-texture relative w-full h-full rounded-[24px]">
          <button onclick="${zoomFuncStr}" class="card-zoom-btn">🔍 Zoom</button>
          ${content.front}
        </div>
        <div class="card-back bg-[#FDFBF7] retro-border p-6 flex flex-col riso-texture relative w-full h-full rounded-[24px]">
          <button onclick="${flipFuncStr}" class="card-zoom-btn">↩ Gira</button>
          ${content.back}
        </div>
      `;
    }

    function renderTeam(isNewShock = false) {
      const vTeam = document.getElementById('view-team');
      if(!vTeam || vTeam.classList.contains('hidden')) return;

      const t = getT(); 
      if(!t) { 
        vTeam.innerHTML = `<div class="h-screen w-full flex flex-col items-center justify-center font-display text-xl text-center p-8 bg-[#FDFBF7]"><div class="text-4xl mb-4">🚨</div><div>Tavolo inesistente.</div><div class="text-sm mt-4 text-gray-500">Chiedi al facilitatore di generare il tavolo e inquadra di nuovo il QR Code.</div></div>`; 
        return; 
      }
      
      const elOnb = document.getElementById('tm-onboarding');
      if(locUI.hasRevealed && elOnb) elOnb.classList.add('hidden');
      
      const d = db[t.sc];
      document.getElementById('tm-view-id').innerText = t.name.toUpperCase(); 
      document.getElementById('tm-title').innerText = d.cx_f.t;

      // Render CARTA CONTESTO
      const ctxFront = `
        <div class="flex-1 flex flex-col justify-center text-center">
          ${d.ico}
          <h3 class="font-display text-2xl font-bold mt-4 leading-tight">${d.cx_f.t}</h3>
          <p class="text-sm text-gray-500 font-medium mt-3 px-2 leading-relaxed">${d.cx_f.d}</p>
        </div>
        <div class="border-t-2 border-[#1A1A1A] pt-4 text-left mt-auto">
          <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-1">Target Assegnato</p>
          <p class="text-sm font-display font-bold">${d.tgt}</p>
        </div>
        <button onclick="teamFlipCtx()" class="absolute bottom-4 right-4 bg-gray-200 text-[#1A1A1A] px-4 py-2 rounded-xl text-xs font-bold retro-btn border-2 border-[#1A1A1A]">↩ Dettagli</button>
      `;
      const ctxBack = `
        <div class="border-b-2 border-[#1A1A1A] pb-3 text-base font-display font-bold uppercase tracking-widest">${d.t}</div>
        <div class="flex-1 flex flex-col justify-center gap-5 text-sm mt-4">
          <div><span class="font-bold text-gray-500 text-[10px] block uppercase tracking-wider mb-1">${d.cx_b.t1}</span><p class="leading-relaxed">${d.cx_b.d1}</p></div>
          <div class="pt-5 border-t-2 border-dashed border-gray-300"><span class="font-bold text-[#FF5A36] text-[10px] block uppercase tracking-wider mb-1">${d.cx_b.t2}</span><p class="leading-relaxed font-bold">${d.cx_b.d2}</p></div>
        </div>
      `;

      document.getElementById('tm-card-ctx').innerHTML = getCardHtml('ctx', {front: ctxFront, back: ctxBack}, "teamFlipCtx()", "teamZoom(true, 'ctx')");
      
      updateTeamTime();

      // INVENTARIO BOTTOM
      const invBox = document.getElementById('tm-inventory-box');
      if(t.hist.length > 0) {
        invBox.classList.remove('hidden'); document.getElementById('tm-inv-count').innerText = `${t.hist.length}/3`;
        document.getElementById('tm-inventory-list').innerHTML = t.hist.map(h => {
            const icon = h.st === 'new' ? '🔒' : (h.st === 'unlocked' ? '🔓' : '✅');
            return `<button onclick="teamViewOld('${h.id}')" class="flex-shrink-0 text-xs font-bold px-3 py-2 rounded-lg border-2 retro-btn transition-colors whitespace-nowrap snap-center ${t.act === h.id ? 'bg-[#1A1A1A] text-white border-[#1A1A1A]' : 'bg-gray-100 text-[#1A1A1A] border-gray-300 hover:bg-gray-200'}">${icon} ${d.cards[h.id].f}</button>`
        }).join('');
      } else invBox.classList.add('hidden');

      // GESTIONE BOTTONE RANDOM (Se permesso)
      document.getElementById('tm-btn-self').classList.toggle('hidden', !st.allowCrash);

      // RENDER CARTA IMPREVISTO ATTIVA
      const w = document.getElementById('tm-wrapper-imp'); 
      
      if (t.act !== null) {
        w.classList.remove('hidden');
        setTimeout(() => { w.classList.remove('opacity-0', 'translate-y-8'); }, 10);

        const card = d.cards[t.act]; 
        const hSt = t.hist.find(x=>x.id===t.act).st;
        const isBlur = hSt === 'new'; 
        const isSurvived = hSt === 'survived';
        
        // Avatar Generativo (DiceBear)
        const avatarUrl = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(card.f + t.act)}&backgroundColor=FDFBF7`;

        const impFront = `
          <div class="flex flex-col items-center justify-center text-center w-full h-full pt-4">
            <div class="w-20 h-20 bg-[#FDFBF7] rounded-full retro-border shadow-md overflow-hidden flex-shrink-0 flex items-center justify-center mb-4">
              <img src="img/avatar_${t.sc}_${t.act}.png" onerror="this.src='${avatarUrl}'" class="w-full h-full object-cover">
            </div>
            <h3 class="font-display text-xl font-bold leading-tight uppercase tracking-widest text-[#FF5A36] px-2 mb-4">${card.f}</h3>
            <div class="w-full flex-1 flex flex-col">
              <div class="bg-white p-4 rounded-xl border-2 border-[#1A1A1A] text-sm font-semibold leading-relaxed shadow-inner text-left relative w-full flex-1">
                 <span class="absolute -top-3 left-4 bg-[#1A1A1A] text-white text-[9px] font-mono px-2 py-0.5 rounded tracking-widest retro-border">MESSAGGIO RICEVUTO</span>
                 <div class="mt-1">${card.d}</div>
              </div>
            </div>
            <button onclick="teamFlipImp()" class="w-full mt-4 bg-[#FF5A36] text-white font-display font-bold px-4 py-3 rounded-xl retro-btn border-2 border-[#1A1A1A]">RISOLVI LA SFIDA ➔</button>
          </div>`;

        const impBack = `
          <div class="border-b-2 border-gray-200 pb-3 flex justify-between items-center">
            <span class="text-sm font-display font-bold uppercase truncate pr-2" style="color: ${d.c}">${card.b1}</span>
          </div>
          <div class="flex-1 flex flex-col pt-4 gap-4">
            <div><p class="text-sm leading-relaxed">${card.bd1}</p></div>
            <div class="pt-4 border-t-2 border-dashed border-gray-300 relative flex-1 flex flex-col">
              <span class="text-[#FF5A36] font-bold text-[10px] block uppercase tracking-wider mb-2">${card.b2}</span>
              <div class="${isBlur ? 'blur-content' : ''} flex-1"><p class="font-bold bg-yellow-50 p-4 border-2 border-yellow-300 rounded-xl text-[#1A1A1A] text-sm leading-relaxed shadow-sm">${isBlur ? card.bd2 : "💡 <i>Suggerimento per il Canvas</i><br><br>" + card.hint}</p></div>
              
              ${isBlur ? `
              <div class="absolute inset-0 flex flex-col items-center justify-center bg-white/50 backdrop-blur-sm rounded-xl">
                <input type="text" id="pw-input-${t.act}" placeholder="Password..." class="w-40 text-lg text-center border-4 border-[#1A1A1A] p-2 rounded-xl mb-3 outline-none focus:border-[#FF5A36] font-bold shadow-inner">
                <button onclick="checkPw('${t.act}')" class="bg-[#1A1A1A] text-white text-xs font-bold px-6 py-3 rounded-xl retro-btn border-2 border-[#1A1A1A]">SBLOCCA HINT 🔓</button>
              </div>` : ''}
              
              ${!isBlur && !isSurvived ? `<button onclick="teamSurvive('${t.act}')" class="w-full mt-auto bg-green-500 text-white font-display font-bold py-3 rounded-xl border-2 border-[#1A1A1A] retro-shadow-sm text-sm active:translate-y-1 transition-transform">DOMINATO SUL CANVAS ✅</button>` : ''}
              ${isSurvived ? `<div class="w-full mt-auto bg-white text-green-600 border-2 border-green-500 font-display font-bold py-3 rounded-xl text-center text-sm transform -rotate-2 shadow-sm uppercase tracking-widest">SFIDA SUPERATA ✅</div>` : ''}
            </div>
          </div>`;
        
        document.getElementById('tm-card-imp').innerHTML = getCardHtml('imp', {front: impFront, back: impBack}, "teamFlipImp()", "teamZoom(true, 'imp')");
        
        if(locUI.zoomType === 'imp') {
           document.getElementById('mod-f-content').innerHTML = impFront;
           document.getElementById('mod-b-content').innerHTML = impBack;
        }
        
        if(isNewShock && locUI.hasRevealed) { 
          document.body.classList.add('alarm-active'); 
          setTimeout(()=>document.body.classList.remove('alarm-active'), 800); 
          playSound('alarm'); 
          // Auto scroll to card
          setTimeout(() => { document.getElementById('team-stage').scrollTo({ top: document.getElementById('team-stage').scrollHeight, behavior: 'smooth' }); }, 100);
        }
        
        document.getElementById('tm-card-imp').classList.toggle('flipped', t.flip); 
        if(locUI.zoomType === 'imp') document.getElementById('modal-inner').classList.toggle('flipped', t.flip);

      } else { 
        w.classList.add('hidden', 'opacity-0', 'translate-y-8'); 
      }

      if(locUI.zoomType === 'ctx') {
        document.getElementById('mod-f-content').innerHTML = ctxFront;
        document.getElementById('mod-b-content').innerHTML = ctxBack;
        document.getElementById('modal-inner').classList.toggle('flipped', ctxFlip);
      }
    }

    function updateTeamTime() { 
      const box = document.getElementById('tm-timer'); 
      if(st.run || st.tr < fasi[st.ph].t) { 
        box.classList.remove('hidden'); 
        box.innerText = `${Math.floor(st.tr/60).toString().padStart(2,'0')}:${(st.tr%60).toString().padStart(2,'0')}`; 
      } else box.classList.add('hidden'); 
    }
    
    let ctxFlip = false; 
    function teamFlipCtx() { ctxFlip = !ctxFlip; document.getElementById('tm-card-ctx').classList.toggle('flipped', ctxFlip); if(locUI.zoomType==='ctx') document.getElementById('modal-inner').classList.toggle('flipped', ctxFlip); }
    
    function checkPw(k) { const val = document.getElementById('pw-input-'+k)?.value; if(val && val.toLowerCase() === 'urca-rischio') { emitEvent('UNLOCK', { tid: myView, log: `Il tavolo ha decifrato la password!` }); playSound('win'); } else alert("Password errata!"); }
    function teamSurvive(k) { playSound('win'); emitEvent('SURVIVE', { tid: myView, log: `✅ Sfida Dominata!` }); }

    function teamSelfShock() { 
      const t = getT(); 
      const keys = ['sfida', 'imprevisto', 'limite'];
      const avail = keys.filter(k => !t.hist.some(h=>h.id === k));
      if(avail.length===0) return; 
      const rKey = avail[Math.floor(Math.random()*avail.length)]; 
      emitEvent('SHOCK', {tid: t.id, imp: rKey, flip: false, log: `Pescata autonoma ➔ ${db[t.sc].cards[rKey].f}`}); 
    }
    
    function teamViewOld(k) { emitEvent('VIEW', {tid: myView, imp: k}); }
    
    function teamZoom(val, type = 'imp') { 
      const m = document.getElementById('modal-zoom'); 
      if(val) { 
        locUI.zoomType = type; renderTeam();
        m.classList.remove('hidden'); m.classList.add('flex'); setTimeout(()=>m.classList.remove('opacity-0'), 10); 
      } else { m.classList.add('opacity-0'); setTimeout(()=>{m.classList.add('hidden');m.classList.remove('flex');}, 300); } 
    }
    function teamFlipImp() { const t = getT(); emitEvent('FLIP', {tid: t.id, flip: !t.flip}); }
    function teamFlipModal() { if(locUI.zoomType === 'ctx') teamFlipCtx(); else teamFlipImp(); }

    window.onload = init;
  </script>
</body>
</html>
